<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">SmartLedger Pro — Dashboard design concept, step 2</title>
<desc id="desc">Arabic RTL finance dashboard concept with summary metrics, inventory warning, cash accounts, and recent operations.</desc>
<defs>
