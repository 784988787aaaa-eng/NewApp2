<rect x="800" y="356" width="528" height="76" rx="16" fill="#17283B"/>
<rect x="800" y="447" width="528" height="76" rx="16" fill="#17283B"/>
<rect x="800" y="538" width="528" height="76" rx="16" fill="#17283B"/>
<g fill="#30445B"><rect x="823" y="379" width="135" height="9" rx="4"/><rect x="823" y="397" width="220" height="7" rx="3"/><rect x="823" y="470" width="170" height="9" rx="4"/><rect x="823" y="488" width="260" height="7" rx="3"/><rect x="823" y="561" width="120" height="9" rx="4"/><rect x="823" y="579" width="230" height="7" rx="3"/></g>
<rect x="776" y="690" width="576" height="70" fill="#101D2E"/>
<path d="M858 714h22m-11-11v22 M978 714h22m-11-11v22 M1098 714h22m-11-11v22 M1218 714h22m-11-11v22" stroke="#6D829B" stroke-width="2" stroke-linecap="round" opacity=".55"/>
<!-- orbit lines only in open state -->
<ellipse cx="1064" cy="548" rx="228" ry="165" fill="none" stroke="#3B82F6" stroke-opacity=".32" stroke-width="1.5" stroke-dasharray="5 9"/>
<ellipse cx="1064" cy="548" rx="174" ry="124" fill="none" stroke="#67E8F9" stroke-opacity=".24" stroke-width="1.5" stroke-dasharray="4 8"/>
<g filter="url(#shadow)">
 <rect x="805" y="365" width="148" height="58" rx="17" fill="url(#node)" stroke="#4B789B"/><text x="879" y="401" text-anchor="middle" class="t label" font-size="17">صنف جديد</text>
 <rect x="978" y="344" width="148" height="58" rx="17" fill="url(#node)" stroke="#4B789B"/><text x="1052" y="380" text-anchor="middle" class="t label" font-size="17">فاتورة بيع</text>
 <rect x="1150" y="365" width="148" height="58" rx="17" fill="url(#node)" stroke="#4B789B"/><text x="1224" y="401" text-anchor="middle" class="t label" font-size="17">فاتورة شراء</text>
 <rect x="808" y="480" width="138" height="58" rx="17" fill="url(#node)" stroke="#5B8F8D"/><text x="877" y="516" text-anchor="middle" class="t label" font-size="17">سند قبض</text>
 <rect x="1182" y="480" width="138" height="58" rx="17" fill="url(#node)" stroke="#9D7CC5"/><text x="1251" y="516" text-anchor="middle" class="t label" font-size="17">سند صرف</text>
 <rect x="840" y="594" width="138" height="58" rx="17" fill="url(#node)" stroke="#B78A50"/><text x="909" y="630" text-anchor="middle" class="t label" font-size="17">مصروف</text>
 <rect x="1150" y="594" width="148" height="58" rx="17" fill="url(#node)" stroke="#B66A7D"/><text x="1224" y="630" text-anchor="middle" class="t label" font-size="17">مردود بيع</text>
 <rect x="986" y="650" width="148" height="58" rx="17" fill="url(#node)" stroke="#4B789B"/><text x="1060" y="686" text-anchor="middle" class="t label" font-size="17">مردود شراء</text>
 <circle cx="1064" cy="548" r="49" fill="#0E7490" opacity=".35" filter="url(#glow)"/>
 <circle cx="1064" cy="548" r="36" fill="url(#planet)" stroke="#B9F3FF" stroke-opacity=".7" stroke-width="1.5"/>
 <path d="M1064 531v34M1047 548h34" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="1064" y="738" text-anchor="middle" class="muted small">تختفي المجموعة بالكامل عند الإغلاق</text>
</svg>