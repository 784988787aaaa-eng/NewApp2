<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">SmartLedger Pro — زر إضافة موحد</title>
<desc id="desc">تصور عربي من اليمين إلى اليسار يوضح زر الإضافة بعلامة زائد وهو مغلق تماماً، ثم خيارات الإنشاء التي تظهر فقط بعد الضغط.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111F"/><stop offset="1" stop-color="#14263D"/></linearGradient>
 <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67E8F9"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
 <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243B56"/><stop offset="1" stop-color="#17283D"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".48"/></filter>
 <style>
 .t{font-family:Tahoma,Arial,sans-serif;fill:#F1F5F9}.muted{font-family:Tahoma,Arial,sans-serif;fill:#9FB2C8}.heading{font-size:29px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:15px}
 </style>
</defs>
<rect width="1440" height="900" fill="url(#bg)"/>
<circle cx="125" cy="90" r="120" fill="#164E63" opacity=".13"/><circle cx="1320" cy="780" r="180" fill="#1D4ED8" opacity=".10"/>
<text x="720" y="66" text-anchor="middle" class="t heading">إضافة واحدة، في كل مكان</text>
<text x="720" y="101" text-anchor="middle" class="muted" font-size="18">تظل الخيارات مخفية حتى يطلبها المستخدم</text>

<!-- default state -->
<rect x="56" y="145" width="640" height="690" rx="30" fill="#101D2E" stroke="#2A405A" stroke-width="1.5"/>
<text x="656" y="194" text-anchor="end" class="t heading">الحالة الافتراضية</text>
<text x="656" y="225" text-anchor="end" class="muted small">زر واحد فقط — لا تظهر أي خيارات</text>
<rect x="88" y="260" width="576" height="500" rx="24" fill="#0B1625" stroke="#243950"/>
<rect x="88" y="260" width="576" height="72" rx="24" fill="#14253A"/>
<text x="625" y="304" text-anchor="end" class="t label">المبيعات</text>
<rect x="112" y="356" width="528" height="76" rx="16" fill="#17283B"/>
<rect x="112" y="447" width="528" height="76" rx="16" fill="#17283B"/>
<rect x="112" y="538" width="528" height="76" rx="16" fill="#17283B"/>
<g fill="#30445B"><rect x="135" y="379" width="135" height="9" rx="4"/><rect x="135" y="397" width="220" height="7" rx="3"/><rect x="135" y="470" width="170" height="9" rx="4"/><rect x="135" y="488" width="260" height="7" rx="3"/><rect x="135" y="561" width="120" height="9" rx="4"/><rect x="135" y="579" width="230" height="7" rx="3"/></g>
<rect x="88" y="690" width="576" height="70" rx="0" fill="#101D2E"/>
<path d="M170 714h22m-11-11v22 M290 714h22m-11-11v22 M410 714h22m-11-11v22 M530 714h22m-11-11v22" stroke="#6D829B" stroke-width="2" stroke-linecap="round" opacity=".55"/>
<g filter="url(#shadow)">
 <circle cx="594" cy="688" r="42" fill="#0E7490" opacity=".23"/>
 <circle cx="594" cy="688" r="31" fill="url(#planet)"/>
 <path d="M594 674v28M580 688h28" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
</g>
<text x="376" y="802" text-anchor="middle" class="muted small">علامة + فقط، بلا أقمار أو تسميات</text>

<!-- expanded state -->
<rect x="744" y="145" width="640" height="690" rx="30" fill="#101D2E" stroke="#2A405A" stroke-width="1.5"/>
<text x="1344" y="194" text-anchor="end" class="t heading">عند الضغط على +</text>
<text x="1344" y="225" text-anchor="end" class="muted small">تظهر الخيارات، ثم تختفي بعد الاختيار أو الإغلاق</text>
<rect x="776" y="260" width="576" height="500" rx="24" fill="#0B1625" stroke="#243950"/>
<rect x="776" y="260" width="576" height="72" rx="24" fill="#14253A"/>
