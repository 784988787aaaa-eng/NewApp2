 <rect x="612" y="765" width="146" height="70" rx="19" fill="#1C3047" stroke="#3B5876"/><circle cx="733" cy="787" r="5" fill="#A78BFA"/><text x="685" y="794" text-anchor="middle" class="t b" font-weight="700">سند قبض</text><text x="685" y="817" text-anchor="middle" class="m s">استلام مبلغ</text>
