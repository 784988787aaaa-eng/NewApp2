<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">SmartLedger Pro — Orbit quick actions and navigation concept</title>
<desc id="desc">Arabic RTL accounting dashboard with an expanded orbital quick action menu, western numerals, and adaptive navigation principles.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1220"/><stop offset="1" stop-color="#132238"/></linearGradient>
 <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".4"/></filter>
 <style>
 .t{font-family:Tahoma,Arial,sans-serif;fill:#F1F5F9}.m{font-family:Tahoma,Arial,sans-serif;fill:#94A3B8}.h{font-size:25px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.v{font-size:26px;font-weight:700}.card{fill:#172438;stroke:#2B3E56;stroke-width:1.4}
 </style>
</defs>
<rect width="1440" height="1000" fill="url(#bg)"/>
<!-- right-side navigation rail for wide screens -->
