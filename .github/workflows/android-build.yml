name: SmartLedger Pro Android CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK Output
        run: |
          echo "Listing generated APK files:"
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLedger-Pro-v2.2.0-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
