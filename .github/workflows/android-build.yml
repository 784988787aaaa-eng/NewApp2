name: SmartLedger Pro Android CI/CD Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_gate_and_build:
    name: Schema Check, Unit & Flow Tests, Lint & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Verify Room Baseline Schema & Non-Destructive Policy
        run: |
          test -f app/schemas/com.smartledger.pro.data.local.SmartLedgerDatabase/1.json
          ! grep -q "fallbackToDestructiveMigration" app/src/main/java/com/smartledger/pro/data/local/SmartLedgerDatabase.kt

      - name: Run Unit, Security & Accounting Business Flow Tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android Lint Static Analysis
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Verify Generated APK Outputs
        run: |
          echo "Listing generated Debug and Release APK files:"
          ls -lh app/build/outputs/apk/debug/ || true
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLedger-Pro-v2.4.0-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
