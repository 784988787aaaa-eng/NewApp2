name: Main Android build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-android-build
  cancel-in-progress: true

jobs:
  android:
    name: Test, lint, and build main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartledger-main-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
